<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Easter Egg Catching Game</title>
<style>
/*Flex layout*/
  @media (max-width: 768px) {
    #game-wrapper {
      flex-direction: column;
    }

    #game-info {
      display: none;
    }
  }

  #game-info {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
  }

  /* Body & layout */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100%; /* prevents the clipping due to viewport height */
    background: #555;
    overflow: auto;
  }

  /* Instructions */
  h2, p {
    margin: 5px;
    color: #ddd;
  }

  /* Canvas styling */
  canvas {
    display: block;
    border: 5px solid #888;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    /* Remove width/height in CSS; JS handles scaling */
     touch-action: none;
  }

  /* Optional watermark */
  body::before {
    content: "RNN Library";
    position: absolute;
    font-size: 80px;
    color: rgba(255,255,255,0.05);
    top: 40%;
    left: 20%;
    transform: rotate(-20deg);
    pointer-events: none;
  }

  #game-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-top: 20px;
  }

  /* Left panel */
  #game-info {
    max-width: 260px;
    color: #ddd;
    text-align: left;
  }

  #game-info h1 {
    font-size: 36px;
    margin-bottom: 10px;
    color: yellow;
  }

  #game-info p {
    font-size: 18px;
    line-height: 1.4;
  }

</style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-info">
        <table><h1>Egg Catch</h1>
        <tr><td><img src=".\src\assets\characters\rabbit_stand.png" alt="Ronnie the RNN Rabbit" height="50%" width="50%"></td><td><p>
            Easter chaos!<br>
            Eggs are raining down on Ronnie!<br>
            Catch them all before it's too late!
        </p>
        <hr/>
        <p>
          M = Music on/off <br/>
          S = Sound on/off <br/>
          R = Restart <br/>
          Q = Quit <br/>
        </p></td></tr></table>

    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<!-- <canvas id="gameCanvas" width="400" height="600"></canvas> -->

<script type="module" src="./src/main.js"></script>

<script>
const canvas = document.getElementById("gameCanvas");

function resizeCanvas() {
  const headerHeight = 80; // space for h2 + p
  const scale = Math.min(
    window.innerWidth / 400,
    window.innerHeight / 600
  );

  canvas.style.width = 400 * scale + "px";
  canvas.style.height = 600 * scale + "px";
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
</script>

</body>
</html>
