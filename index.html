<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Easter Egg Catching Game</title>
<style>
 body {
    margin: 0;
    background: #555; /* darker metallic */
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

canvas {
    display: block;
    background: linear-gradient(135deg, #444 0%, #666 25%, #444 50%, #666 75%, #444 100%);
    background-size: 200% 200%;
    border: 5px solid #888;
    border-radius: 8px;
}

/* Optional brushed chrome effect */
body::before {
    content: "RNN Library";
    position: absolute;
    font-size: 80px;
    color: rgba(255,255,255,0.05);
    top: 40%;
    left: 20%;
    transform: rotate(-20deg);
    pointer-events: none;
}
</style>
</head>
<body>

<h2>Egg Catcher</h2>
<p>Use ← and → to move</p>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script type="module" src="./src/main.js"></script>
</body>
</html>
