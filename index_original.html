<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3 Lane Shooter Prototype</title>
<style>
    body {
        margin: 0;
        background: #111;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }
    canvas {
        background: #222;
        display: block;
        margin: 0 auto;
    }
</style>
</head>
<body>

<h2>3 Lane Auto Shooter</h2>
<p>Use ← and → to move</p>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const laneCount = 3;
const laneWidth = canvas.width / laneCount;
const playerY = canvas.height - 60;

let playerLane = 1;
let bullets = [];
let enemies = [];
let score = 0;

// === Player Auto Fire ===
setInterval(() => {
    bullets.push({
        x: playerLane * laneWidth + laneWidth / 2,
        y: playerY
    });
}, 300);

// === Enemy Wave Spawn ===
setInterval(() => {
    for (let i = 0; i < laneCount; i++) {
        if (Math.random() < 0.6) {
            enemies.push({
                lane: i,
                y: -20,
                speed: 2 + Math.random() * 1.5
            });
        }
    }
}, 1000);

// === Input ===
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" && playerLane > 0) {
        playerLane--;
    }
    if (e.key === "ArrowRight" && playerLane < laneCount - 1) {
        playerLane++;
    }
});

// === Game Loop ===
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    // Move bullets
    bullets.forEach(b => b.y -= 6);
    bullets = bullets.filter(b => b.y > 0);

    // Move enemies
    enemies.forEach(e => e.y += e.speed);

    // Collision detection
    enemies.forEach((enemy, ei) => {
        bullets.forEach((bullet, bi) => {
            const enemyX = enemy.lane * laneWidth + laneWidth / 2;

            if (
                Math.abs(bullet.x - enemyX) < 20 &&
                Math.abs(bullet.y - enemy.y) < 20
            ) {
                enemies.splice(ei, 1);
                bullets.splice(bi, 1);
                score++;
            }
        });
    });

    // Remove enemies that reach bottom
    enemies = enemies.filter(e => e.y < canvas.height + 20);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw lane lines
    ctx.strokeStyle = "#333";
    for (let i = 1; i < laneCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, canvas.height);
        ctx.stroke();
    }

    // Draw player
    ctx.fillStyle = "cyan";
    ctx.fillRect(
        playerLane * laneWidth + laneWidth / 2 - 20,
        playerY,
        40,
        20
    );

    // Draw bullets
    ctx.fillStyle = "yellow";
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw enemies
    ctx.fillStyle = "red";
    enemies.forEach(e => {
        ctx.fillRect(
            e.lane * laneWidth + laneWidth / 2 - 20,
            e.y,
            40,
            40
        );
    });

    // Draw score
    ctx.fillStyle = "white";
    ctx.fillText("Score: " + score, 10, 20);
}

gameLoop();
</script>

</body>
</html>
